name: FLUX Voice PTBR Source Audit
on:
  push:
    branches: [feature/flux-voice-01-owned-offline-studio-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify official Brazilian model loader references
        run: |
          python - <<'PY'
          import urllib.request
          from urllib.error import URLError
          urls=[
            'https://huggingface.co/spaces/ResembleAI/Chatterbox-Multilingual-TTS-pt-br/raw/main/app.py',
            'https://raw.githubusercontent.com/resemble-ai/chatterbox/master/src/chatterbox/mtl_tts.py',
          ]
          for u in urls:
              print('SOURCE',u,flush=True)
              try:
                  with urllib.request.urlopen(u,timeout=15) as f: source=f.read().decode()
                  lines=source.splitlines()
                  print('LINES',len(lines))
                  for i,line in enumerate(lines):
                      if any(term in line for term in ('snapshot_download','safetensors','ChatterboxMultilingualTTS','from_pretrained','t3_pt_br','s3gen_v3','load_state_dict')):
                          print('MATCH',i+1, ' '.join(lines[max(0,i-2):min(len(lines),i+3)]).strip()[:740],flush=True)
              except Exception as e:
                  print('SOURCE ERROR',str(e)[:300],flush=True)
          PY
