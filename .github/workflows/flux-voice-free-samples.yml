name: FLUX Voice Open-Source Demo Probe
on:
  push:
    branches: [experiments/flux-voice-free-samples-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet 'gradio_client>=1.8,<3'
      - name: Discover public model demo API endpoints
        run: python scripts/probe_hf_voice_spaces.py
