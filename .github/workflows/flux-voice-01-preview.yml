name: FLUX VOICE 01 Android Preview

on:
  push:
    branches:
      - feature/flux-voice-01-ondevice-android-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile installable Android preview plus instrumentation test APK
        working-directory: apps/android
        env:
          FLUX_APPLICATION_ID: ai.flux.mobile.preview.voice01
          FLUX_APP_LABEL: FLUX Voice 01
          FLUX_CORE_URL: https://flux-evolution-preview.mauri20102023.workers.dev
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Save diagnostic APK and checksum
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk FLUX-VOICE-01-PREVIEW.apk
          sha256sum FLUX-VOICE-01-PREVIEW.apk > FLUX-VOICE-01-PREVIEW.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FLUX-VOICE-01-PREVIEW
          path: |
            FLUX-VOICE-01-PREVIEW.apk
            FLUX-VOICE-01-PREVIEW.sha256
          retention-days: 14
          if-no-files-found: error
