name: Build FLUX Mobile 1.7.6

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Android signing tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p flux-signing-tools/lib flux-signing-tools/lib64
          cp "$BUILD_TOOLS/apksigner" flux-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" flux-signing-tools/lib/
          cp "$BUILD_TOOLS/lib64/libc++.so" flux-signing-tools/lib64/
          cp "$BUILD_TOOLS/zipalign" flux-signing-tools/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: flux-signing-tools
          path: flux-signing-tools
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile FLUX Gemini Live APK
        working-directory: apps/android
        env:
          FLUX_CORE_URL: "https://flux-core-12.mauri20102023.workers.dev"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK and checksum
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.7.6.apk
          sha256sum FLUX-Mobile-1.7.6.apk > FLUX-Mobile-1.7.6.sha256

      - name: Upload setup APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.7.6
          path: |
            FLUX-Mobile-1.7.6.apk
            FLUX-Mobile-1.7.6.sha256
          if-no-files-found: error
          retention-days: 7
