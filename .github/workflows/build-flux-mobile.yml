name: Build FLUX Mobile 1.4.0

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Android signing tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p flux-signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" flux-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" flux-signing-tools/lib/
          cp "$BUILD_TOOLS/zipalign" flux-signing-tools/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: flux-signing-tools
          path: flux-signing-tools
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract sanitized Android source
        run: unzip -q source/FLUX-Mobile-Android-1.4.0.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no private pairing key is stored in source
        run: test ! -e apps/android/flux.mobile.pairing

      - name: Prepare private APK configuration
        env:
          FLUX_MOBILE_PAIRING_PRIVATE_KEY: "${{ secrets.FLUX_MOBILE_PAIRING_PRIVATE_KEY }}"
        run: |
          if [ -n "$FLUX_MOBILE_PAIRING_PRIVATE_KEY" ]; then
            echo "FLUX_MOBILE_PAIRING_PRIVATE_KEY=$FLUX_MOBILE_PAIRING_PRIVATE_KEY" >> "$GITHUB_ENV"
          else
            python -c 'print("FLUX_MOBILE_PAIRING_PRIVATE_KEY=" + "A" * 1624)' >> "$GITHUB_ENV"
            echo "Using a disposable compile-time placeholder; the release pipeline replaces it before signing."
          fi

      - name: Compile staged APK
        working-directory: apps/android
        env:
          FLUX_CORE_URL: "https://flux-mobile-build2.mauri20102023.workers.dev"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK and checksum
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.4.0.apk
          sha256sum FLUX-Mobile-1.4.0.apk > FLUX-Mobile-1.4.0.sha256

      - name: Upload setup APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.4.0
          path: |
            FLUX-Mobile-1.4.0.apk
            FLUX-Mobile-1.4.0.sha256
          if-no-files-found: error
          retention-days: 7
