name: Build FLUX Mobile 1.2.4

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLUX_CORE_URL: ${{ secrets.FLUX_CORE_URL }}
      FLUX_MOBILE_TOKEN: ${{ secrets.FLUX_MOBILE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract sanitized Android source
        run: unzip -q source/FLUX-Mobile-Android-1.2.4.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no credentials are stored in source
        run: test ! -e apps/android/flux.mobile.token

      - name: Compile release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare configured APK
        if: ${{ env.FLUX_CORE_URL != '' && env.FLUX_MOBILE_TOKEN != '' }}
        run: cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.2.4-link.apk

      - name: Upload configured APK
        if: ${{ env.FLUX_CORE_URL != '' && env.FLUX_MOBILE_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.2.4-link
          path: FLUX-Mobile-1.2.4-link.apk
          if-no-files-found: error
          retention-days: 7

      - name: Explain missing production configuration
        if: ${{ env.FLUX_CORE_URL == '' || env.FLUX_MOBILE_TOKEN == '' }}
        run: echo "Compilation passed, but the installable artifact was not published because production secrets are not configured."
