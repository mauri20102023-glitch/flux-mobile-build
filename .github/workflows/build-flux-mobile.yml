name: Build FLUX Mobile 1.3.1

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract sanitized Android source
        run: unzip -q source/FLUX-Mobile-Android-1.3.1.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no private pairing key is stored in source
        run: test ! -e apps/android/flux.mobile.pairing

      - name: Check private APK configuration
        id: pairing
        env:
          FLUX_MOBILE_PAIRING_PRIVATE_KEY: "${{ secrets.FLUX_MOBILE_PAIRING_PRIVATE_KEY }}"
        run: |
          if [ -n "$FLUX_MOBILE_PAIRING_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Private APK build skipped: repository secret is not configured."
          fi

      - name: Compile setup APK
        if: steps.pairing.outputs.enabled == 'true'
        working-directory: apps/android
        env:
          FLUX_CORE_URL: "https://flux-mobile-build2.mauri20102023.workers.dev"
          FLUX_MOBILE_PAIRING_PRIVATE_KEY: "${{ secrets.FLUX_MOBILE_PAIRING_PRIVATE_KEY }}"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK and checksum
        if: steps.pairing.outputs.enabled == 'true'
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.3.1.apk
          sha256sum FLUX-Mobile-1.3.1.apk > FLUX-Mobile-1.3.1.sha256

      - name: Upload setup APK
        if: steps.pairing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.3.1
          path: |
            FLUX-Mobile-1.3.1.apk
            FLUX-Mobile-1.3.1.sha256
          if-no-files-found: error
          retention-days: 7
