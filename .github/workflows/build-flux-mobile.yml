name: Build FLUX Mobile 1.8.0

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check site and Core bundle
        run: |
          node --check web/flux-ath/app.js
          node --check web/flux-ath/sw.js
          npm run check

  signing-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Android signing tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p flux-signing-tools/lib flux-signing-tools/lib64
          cp "$BUILD_TOOLS/apksigner" flux-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" flux-signing-tools/lib/
          cp "$BUILD_TOOLS/lib64/libc++.so" flux-signing-tools/lib64/
          cp "$BUILD_TOOLS/zipalign" flux-signing-tools/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: flux-signing-tools
          path: flux-signing-tools
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile FLUX Voice APK
        working-directory: apps/android
        env:
          FLUX_CORE_URL: "https://flux-mobile-build2.mauri20102023.workers.dev"
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify assistant recognition metadata in APK
        run: |
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          found=0
          # Android Gradle may shorten resource paths inside the release APK.
          while IFS= read -r resource; do
            xml=$("$AAPT" dump xmltree "$APK" "$resource")
            if [[ "$xml" == *'ai.flux.mobile.assistant.FluxRecognitionService'* ]]; then
              found=1
              break
            fi
          done < <(unzip -Z1 "$APK" | grep '^res/.*\.xml$')
          test "$found" -eq 1

      - name: Prepare APK and checksum
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.8.0.apk
          sha256sum FLUX-Mobile-1.8.0.apk > FLUX-Mobile-1.8.0.sha256

      - name: Upload setup APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.8.0
          path: |
            FLUX-Mobile-1.8.0.apk
            FLUX-Mobile-1.8.0.sha256
          if-no-files-found: error
          retention-days: 7
