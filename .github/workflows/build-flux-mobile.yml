name: Build FLUX Mobile 1.2.4

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: flux-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract sanitized Android source
        run: unzip -q source/FLUX-Mobile-Android-1.2.4.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no credentials are stored in source
        run: test ! -e apps/android/flux.mobile.token

      - name: Compile setup APK without credentials
        working-directory: apps/android
        env:
          FLUX_CORE_URL: ""
          FLUX_MOBILE_TOKEN: ""
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK and checksum
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk FLUX-Mobile-1.2.4-link.apk
          sha256sum FLUX-Mobile-1.2.4-link.apk > FLUX-Mobile-1.2.4-link.sha256

      - name: Upload setup APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Mobile-1.2.4-link
          path: |
            FLUX-Mobile-1.2.4-link.apk
            FLUX-Mobile-1.2.4-link.sha256
          if-no-files-found: error
          retention-days: 7
